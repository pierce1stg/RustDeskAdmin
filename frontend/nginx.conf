server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Entry point must revalidate every load: hashed assets below are
    # immutable, but index.html points at them — a stale index.html pins an
    # ancient bundle (seen in the wild: users testing long-dead JS).
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed vite assets: safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # Same no-cache as =/index.html: the SPA fallback serves index.html
        # under every route (/settings, ...), and a cached copy would pin an
        # ancient bundle after each deploy.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}